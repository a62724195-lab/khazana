f1t:'Search by description, not by name',f1:'Forgot the file name? Type “something to convert a PDF” or “the contract photo” and it finds it. Normal search is instant; AI search is optional and uses your own key.',
f2t:'Sections inside sections',f2:'Organize your vault with rooms inside rooms like folders, with colors, pinning and three view modes: large, small and list.',
f3t:'Make it yours',f3:'15 themes, 18 colors plus a custom one, sharp or round corners, 8 card styles, fonts and your own wallpaper. And a “Random” button if you feel adventurous.',
f4t:'Fences on your desktop',f4:'Turn any section into a fence on your desktop. Drag files in, or make it smart: “Most used” and “Recently opened”.',
f5t:'Instant search from anywhere',f5:'Press Ctrl+Alt+F to search your whole vault and open with Enter. Press Ctrl+Alt+N to jot a quick note without opening the app.',
f6t:'Notes with real power',f6:'Checklists, tags, templates, links between notes, images with Ctrl+V, password lock, Markdown export, and optional AI tools.',
f7t:'Groups with schedules',f7:'“Study mode” opens all your apps in one click — even at a set time every day. Import your Steam and Epic games in one click.',
f9t:'The Today page',f9:'When the app opens you see your reminders, notes and most-used items — your whole day on one page.',f10t:'Universal search with Ctrl+K',f10:'Type a word and find your files, notes, reminders and boards at once — plus app commands.',f11t:'A free-form board for ideas',f11:'Colored text cards, images (Ctrl+V), items from your vault and your notes — drag, zoom and link them with lines. Make as many boards as you like.',f12t:'Full control of the look',f12:'The “Design” tab in settings: themes with previews, colors, corners, card styles, density, fonts, wallpapers and motion.',f8t:'Tidy settings',f8:'A full settings page with clear sections: appearance, data & backup, import, tools, desktop and AI.',
mt:'And more…',ml:'Small things that matter:',
more:['🗑️ Trash','👤 Profiles','💾 Auto backup','🎮 Steam & Epic import','🔖 Browser bookmarks import','📋 Add from clipboard','📥 Downloads watcher','⏱️ Play time','📊 Stats','🧹 Dead & duplicate scan','🏠 Today page','🎨 Free-form board','🎲 Random theme','🖼️ Your own wallpaper','⌨️ Command palette Ctrl+K','🔄 In-app updates'],
it:'Install in three steps',il:'No complicated setup.',s1t:'Download',s1:'Click the download button to get Khazana-Windows.zip.',s2t:'Extract',s2:'Right-click → Extract All, and put the folder anywhere you like.',s3t:'Run Khazana.exe',s3:'That is it! Later it updates from inside the app: ⋯ → Update app.',
warn:'⚠️ Windows may show a “SmartScreen” warning because the app is free and not signed with a paid certificate. Click “More info” then “Run anyway”. The whole source code is open for you to review.',src:'📂 Source code',
qt:'FAQ',faq:[['Is it really free?','Yes — completely free and open source, with no ads and no subscriptions.'],['Where is my data stored?','On your own computer (the AppData folder). Nothing is sent to any server. The only exceptions: if you enable AI with your own key, only the needed data goes to Anthropic; and if you enable Reminders sync, data goes to your own Supabase account.'],['Is the lock real encryption?','No. It is a light protection that hides content inside the app; the file itself is not encrypted. Do not rely on it for highly sensitive secrets.'],['Which systems does it support?','Windows for now.'],['How do I update it?','From inside the app: ⋯ → 🔄 Update app.']],
foot:'Made with ❤ — free & open source.'}};
let L='ar';try{const s=localStorage.getItem('kz-lang');L=s||((navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en')}catch(e){L=(navigator.language||'').toLowerCase().startsWith('ar')?'ar':'en'}
function apply(){const t=T[L];document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';document.title=L==='ar'?'خزنة — Khazana':'Khazana — خزنة';
 document.querySelectorAll('[data-i]').forEach(e=>{if(t[e.dataset.i]!=null)e.textContent=t[e.dataset.i]});
 document.querySelectorAll('[data-img]').forEach(e=>{e.src='img/'+L+'_'+e.dataset.img+'.'+(e.dataset.ext||'jpg')});
 document.getElementById('cloud').innerHTML=t.more.map(x=>'<span>'+x+'</span>').join('');
 document.getElementById('faqs').innerHTML=t.faq.map(q=>'<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>').join('');
 const v=document.getElementById('vv');const src='media/ad-'+L+'.mp4';if(!v.src.endsWith(src)){v.poster='media/poster-'+L+'.jpg';v.src=src}
 document.getElementById('lang').textContent=L==='ar'?'EN':'عربي'}
document.getElementById('lang').onclick=()=>{L=L==='ar'?'en':'ar';try{localStorage.setItem('kz-lang',L)}catch(e){}apply()};
apply();
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach(e=>io.observe(e));
</script></body></html>
